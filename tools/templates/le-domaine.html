{% extends "base.html" %}
{% set d = t.domaine %}
{% block main %}
<div class="page-hero" style="background-image:url('{{ rel }}{{ s.domaine[1] }}')">
  <div class="wrap"><div class="eyebrow" style="color:#E7C59A">{{ ui.tagline }}</div><h1>{{ d.h1 }}</h1></div>
</div>
<section class="wrap">
  <div class="cols">
    <div class="frame"><img src="{{ rel }}{{ s.domaine[2] }}" alt="{{ d.captions[2] }}"></div>
    <div{% if lang == 'fr' %} data-note="{{ t.notes.domaine_txt }}"{% endif %}>
      {% for p in d.p %}<p class="lead" style="max-width:none;margin:0 0 14px">{{ p }}</p>{% endfor %}
      <a class="btn btn-o" href="{{ s.virtual_tour }}" rel="noopener" target="_blank">{{ ui.virtual_tour }}</a>
    </div>
  </div>
</section>
<section class="wrap" style="padding-top:0">
  <div class="sec-head"><h2>{{ d.gallery_h }}</h2><a class="more" href="diaporama.html">{{ t.nav.diaporama }} →</a></div>
  <div class="gallery"{% if lang == 'fr' %} data-note="{{ t.notes.hero }}"{% endif %}>
    {% for img in s.domaine %}<a href="{{ rel }}{{ img }}" data-cap="{{ d.captions[loop.index0] }}"><img src="{{ rel }}{{ img }}" alt="{{ d.captions[loop.index0] }}" loading="lazy"></a>{% endfor %}
  </div>
</section>
{% endblock %}
