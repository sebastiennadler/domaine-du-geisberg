{% extends "base.html" %}
{% set v = t.videos %}
{% block main %}
<section class="wrap" style="padding-top:28px">
  <div class="eyebrow">{{ ui.tagline }}</div>
  <h1 style="font-size:clamp(30px,5vw,46px)">{{ v.h1 }}</h1>
  <p class="lead">{{ v.lead }}</p>
  <div class="videos"{% if notes %} data-note="{{ t.notes.videos }}"{% endif %}>
    {% for vid in s.videos %}{% set tx = v.clips[loop.index0] %}
    <figure class="video{{ ' small' if vid.get('small') }}">
      <video controls preload="none" playsinline poster="{{ src(vid.poster) }}" width="{{ vid.w }}" height="{{ vid.h }}"{% if vid.get('small') %} style="max-width:{{ vid.w * 2 }}px"{% endif %}>
        <source src="{{ rel }}videos/{{ vid.id }}.mp4" type="video/mp4">
        <a href="{{ rel }}videos/{{ vid.id }}.mp4">{{ v.download }}</a>
      </video>
      <figcaption><b>{{ tx[0] }}</b><span>{{ tx[1] }}</span><small>{{ vid.duration }}{% if vid.get('small') %} · {{ v.small_note }}{% endif %}</small></figcaption>
    </figure>
    {% endfor %}
  </div>
</section>
<section class="wrap" style="padding-top:0">
  <div class="links-row"><a class="more" href="diaporama.html">{{ t.nav.diaporama }} →</a><a class="more" href="visite.html">{{ t.nav.visite }} →</a><a class="more" href="le-domaine.html">{{ t.nav['le-domaine'] }} →</a></div>
</section>
{% endblock %}
