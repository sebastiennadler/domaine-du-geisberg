{% extends "base.html" %}
{% set v = t.visite %}
{% block main %}
<section class="wrap" style="padding-top:28px">
  <div class="eyebrow">{{ ui.tagline }}</div>
  <h1 style="font-size:clamp(30px,5vw,46px)">{{ v.h1 }}</h1>
  <p class="lead">{{ v.lead }}</p>
  <div class="visite"{% if notes %} data-note="{{ t.notes.visite }}"{% endif %}><iframe src="{{ s.virtual_tour_https }}" title="{{ v.h1 }}" loading="lazy" allowfullscreen allow="fullscreen; gyroscope; accelerometer"></iframe></div>
  <p class="note" style="margin-top:14px">{{ v.fallback }} <a href="{{ s.virtual_tour_https }}" rel="noopener" target="_blank">{{ v.open }}</a></p>
  <div class="links-row" style="margin-top:28px"><a class="more" href="gites.html">{{ t.nav.gites }} →</a><a class="more" href="videos.html">{{ t.nav.videos }} →</a><a class="more" href="diaporama.html">{{ t.nav.diaporama }} →</a></div>
</section>
{% endblock %}
