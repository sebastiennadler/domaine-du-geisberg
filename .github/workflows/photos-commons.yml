name: Photos libres (Wikimedia Commons)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  photos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pillow
      - run: python3 tools/fetch_commons.py
      - run: |
          git config user.name "photos-bot"; git config user.email "photos@domainedugeisberg.fr"
          git add assets/img src/catalog/credits.json
          git diff --cached --quiet || (git commit -m "Photos libres ajoutées (Wikimedia Commons)" && git push)
