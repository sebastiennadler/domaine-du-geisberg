name: Vérifier les liens
on:
  workflow_dispatch:
  schedule:
    - cron: "41 6 * * 1"   # chaque lundi matin
permissions:
  contents: write
jobs:
  liens:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tester chaque lien externe
        run: |
          mkdir -p tools
          echo "# Rapport des liens externes — $(date -u +%Y-%m-%d\ %H:%M) UTC" > tools/liens-rapport.md
          echo "" >> tools/liens-rapport.md
          echo "| Code | Lien |" >> tools/liens-rapport.md; echo "|---|---|" >> tools/liens-rapport.md
          grep -hoE 'href="https?://[^"]+"' index.html gites.html gite-1.html gite-2.html le-domaine.html autour.html avis.html reservation.html diaporama.html mentions-legales.html | sed 's/href="//;s/"$//' | grep -v 'fonts.g\|sebastiennadler.github.io\|domainedugeisberg.fr' | sort -u > /tmp/liens.txt
          [ -f tools/liens-candidats.txt ] && cat tools/liens-candidats.txt >> /tmp/liens.txt
          while read -r u; do
            code=$(curl -sL -A "Mozilla/5.0 (Macintosh; Intel Mac OS X 14_0) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/17.0 Safari/605.1.15" -o /dev/null -w "%{http_code}" --max-time 25 "$u" || echo "ERR")
            echo "| $code | $u |" >> tools/liens-rapport.md
          done < /tmp/liens.txt
          cat tools/liens-rapport.md
      - name: Enregistrer le rapport
        run: |
          git config user.name "liens-bot"; git config user.email "liens@domainedugeisberg.fr"
          git add tools/liens-rapport.md
          git diff --cached --quiet || (git commit -m "Rapport de vérification des liens" && git push)
