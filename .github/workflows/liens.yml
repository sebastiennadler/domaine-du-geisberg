name: Vérifier les liens
on:
  workflow_dispatch:
  schedule:
    - cron: "41 6 * * 1"   # chaque lundi matin
permissions:
  contents: write
jobs:
  liens:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q jinja2 markupsafe && python3 tools/build.py
      - name: Tester chaque lien externe
        run: |
          mkdir -p docs
          echo "# Rapport des liens externes — $(date -u +%Y-%m-%d\ %H:%M) UTC" > docs/liens-rapport.md
          echo "" >> docs/liens-rapport.md
          echo "| Code | Lien |" >> docs/liens-rapport.md; echo "|---|---|" >> docs/liens-rapport.md
          grep -hoE 'href="https?://[^"]+"' dist/*.html | sed 's/href="//;s/"$//' | grep -v 'fonts.g\|sebastiennadler.github.io\|domainedugeisberg.fr' | sort -u > /tmp/liens.txt
          [ -f src/catalog/liens-candidats.txt ] && cat src/catalog/liens-candidats.txt >> /tmp/liens.txt
          while read -r u; do
            code=$(curl -sL -A "Mozilla/5.0 (Macintosh; Intel Mac OS X 14_0) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/17.0 Safari/605.1.15" -o /dev/null -w "%{http_code}" --max-time 25 "$u" || echo "ERR")
            echo "| $code | $u |" >> docs/liens-rapport.md
          done < /tmp/liens.txt
          cat docs/liens-rapport.md
      - name: Enregistrer le rapport
        run: |
          git config user.name "liens-bot"; git config user.email "liens@domainedugeisberg.fr"
          git add docs/liens-rapport.md
          git diff --cached --quiet || (git commit -m "Rapport de vérification des liens" && git push)
